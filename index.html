<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="Apprendre le créole martiniquais en jouant, avec Mamie et Papi."><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Ti-kozé"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="icon" href="icon-192.png" sizes="192x192"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="theme-color" content="#FFF7EC" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#16120F" media="(prefers-color-scheme: dark)"><title>Ti-kozé</title><style>:root{color-scheme:light}body{margin:0;font:14px/1.4 system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   PALÉ KRÉYÒL — tokens, composants et animations repris À LA LETTRE de la
   maquette de Léa (maquette.html). Seul le bloc « ADAPTATION PLEIN ÉCRAN »
   en fin de feuille est propre au jeu : il fait passer l'écran de 375×760
   dans un cadre de téléphone à la fenêtre réelle.
   ========================================================================== */
:root{
  --bg:#FFF7EC; --surface:#FFFFFF; --surface-2:#FFEFD9; --line:#F0DFC8;
  --ink:#221A16; --ink-2:#5E5048; --on-fill:#1B1411;
  /* Aplats vifs : identiques en clair et en sombre */
  --c-lagon:#12B5A9; --c-mango:#FFB627; --c-flamboyant:#FF6B35; --c-ciel:#3BA7F5;
  --c-hibiscus:#F0476B; --c-bougain:#B07CF0; --c-canne:#7CC64B; --c-ananas:#FFD93D; --c-goyave:#FF8AA0;
  /* Ombres pleines des boutons 3D */
  --d-lagon:#0B7F77; --d-mango:#C98500; --d-hibiscus:#B8264A; --d-neutral:#E3CFB3;
  /* Texte coloré sur le fond */
  --t-lagon:#0B6E67; --t-hibiscus:#B0173F; --t-mango:#8A5A00;
  /* États de jeu */
  --ok:#22B573; --ok-soft:#DDF6E8; --ok-text:#0D6B3F; --d-ok:#13804F;
  --ko:#F2545B; --ko-soft:#FFE3E2; --ko-text:#A3161E; --d-ko:#B42A30;
  /* Jokers : état « passé » (information neutre, ni juste ni faux) */
  --info-soft:#DDEFFD; --info-text:#0D4A78; --d-info:#1F7FC4;
  /* Plateau d'illustration : constant dans les deux thèmes */
  --plate:#FFF1DC;
  --font-display:'Fredoka','Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-text:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --fs-xs:13px; --fs-sm:15px; --fs-base:17px; --fs-lg:20px; --fs-xl:24px; --fs-2xl:30px; --fs-3xl:40px;
  --r-sm:10px; --r-md:16px; --r-lg:24px; --r-xl:32px; --r-pill:999px;
  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:20px; --s-6:24px; --s-7:32px; --s-8:40px;
  --sh-1:0 1px 2px rgba(34,26,22,.08),0 2px 8px rgba(34,26,22,.06);
  --sh-2:0 8px 24px rgba(34,26,22,.14);
  --press:4px;
  --dur-fast:150ms; --dur-mid:260ms; --dur-flip:480ms; --dur-slow:800ms;
  --ease-out:cubic-bezier(.2,.8,.2,1); --ease-spring:cubic-bezier(.34,1.56,.64,1); --ease-io:cubic-bezier(.45,0,.55,1);
  --frame:#2B2420;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#16120F; --surface:#221C18; --surface-2:#2E2620; --line:#3E342C; --ink:#FBF3E8; --ink-2:#C9BBAA;
  --d-neutral:#120E0B; --t-lagon:#5FE0D5; --t-hibiscus:#FF8FA6; --t-mango:#FFC95C;
  --ok-soft:#123222; --ok-text:#6BE3A0; --ko-soft:#3A1618; --ko-text:#FF9A9E; --info-soft:#10273A; --info-text:#8CCBFA;
  --sh-1:0 1px 2px rgba(0,0,0,.4),0 2px 8px rgba(0,0,0,.3); --sh-2:0 8px 24px rgba(0,0,0,.5);
  --frame:#0A0807; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#16120F; --surface:#221C18; --surface-2:#2E2620; --line:#3E342C; --ink:#FBF3E8; --ink-2:#C9BBAA;
  --d-neutral:#120E0B; --t-lagon:#5FE0D5; --t-hibiscus:#FF8FA6; --t-mango:#FFC95C;
  --ok-soft:#123222; --ok-text:#6BE3A0; --ko-soft:#3A1618; --ko-text:#FF9A9E; --info-soft:#10273A; --info-text:#8CCBFA;
  --sh-1:0 1px 2px rgba(0,0,0,.4),0 2px 8px rgba(0,0,0,.3); --sh-2:0 8px 24px rgba(0,0,0,.5);
  --frame:#0A0807; color-scheme:dark;
}
*{box-sizing:border-box}
/* Plateau d'illustration (maquette) */
.plate{background:var(--plate);border-radius:var(--r-lg);display:grid;place-items:center}
.plate svg{width:80%;height:80%}
/* ===================== Écran de jeu ===================== */
.screen{position:relative;width:375px;max-width:100%;height:760px;border-radius:42px;overflow:hidden;
  background:var(--bg);color:var(--ink);display:flex;flex-direction:column;font-family:var(--font-text)}
.statusbar{height:34px;flex:none}
.scr-body{flex:1;overflow:hidden;padding:0 var(--s-5);display:flex;flex-direction:column;min-height:0}
.scr-foot{flex:none;padding:var(--s-4) var(--s-5) var(--s-6)}
.ic{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ic.fill{fill:currentColor;stroke:none}
.chips{display:flex;gap:var(--s-2);align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:var(--r-pill);
  background:var(--surface);box-shadow:var(--sh-1);font:800 var(--fs-sm) var(--font-text);color:var(--ink);flex:none}
.chip .ic{width:20px;height:20px}
.chip.flame .ic{color:var(--c-flamboyant)}
.chip.xp .ic{color:var(--c-ciel)}
/* Boutons 3D */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;border:0;border-radius:var(--r-md);
  font:700 var(--fs-lg) var(--font-display);letter-spacing:.2px;cursor:pointer;color:var(--on-fill);background:var(--c-lagon);
  box-shadow:0 var(--press) 0 var(--d-lagon);transition:transform var(--dur-fast) var(--ease-out),box-shadow var(--dur-fast) var(--ease-out)}
.btn:active{transform:translateY(var(--press));box-shadow:0 0 0 var(--d-lagon)}
.btn.ghost{background:var(--surface);color:var(--ink);box-shadow:0 var(--press) 0 var(--d-neutral);border:2px solid var(--line)}
.btn:focus-visible,.opt:focus-visible,.tile:focus-visible,.card3d:focus-visible,.pick:focus-visible{outline:3px solid var(--c-ciel);outline-offset:3px}
/* En-tête des modes */
.game-head{display:flex;align-items:center;gap:var(--s-3);padding:var(--s-2) var(--s-5) var(--s-2);flex:none}
.icon-btn{width:44px;height:44px;border-radius:var(--r-pill);border:0;background:none;color:var(--ink-2);display:grid;place-items:center;cursor:pointer;flex:none}
.prog{flex:1;height:16px;border-radius:var(--r-pill);background:var(--surface-2);overflow:hidden;position:relative}
.prog i{position:absolute;inset:0 auto 0 0;border-radius:var(--r-pill);background:var(--c-canne);transition:width 400ms var(--ease-out)}
.prog i::after{content:"";position:absolute;left:8px;right:8px;top:4px;height:4px;border-radius:4px;background:rgba(255,255,255,.45)}
.mode-tag{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;font:800 var(--fs-xs) var(--font-text);letter-spacing:.6px;text-transform:uppercase;
  padding:5px 10px;border-radius:var(--r-pill);color:var(--on-fill);flex:none}
.mode-tag .ic{width:16px;height:16px}

/* ===== Guide + bulle ===== */
.say{display:flex;align-items:flex-end;gap:var(--s-2);margin:var(--s-2) 0 var(--s-3);flex:none}
.say .guide{width:78px;flex:none}
.bubble{position:relative;flex:1;min-width:0;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:10px 14px;margin-bottom:14px;
  box-shadow:var(--sh-1);transform-origin:0 100%}
.bubble::before{content:"";position:absolute;left:-9px;bottom:14px;width:14px;height:14px;background:var(--surface);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.bubble .kr{display:block;font:700 var(--fs-lg) var(--font-display);line-height:1.2;color:var(--ink)}
.bubble .frg{display:block;font:600 var(--fs-sm) var(--font-text);color:var(--ink-2);margin-top:2px}
.bubble .q{display:block;font:700 var(--fs-lg) var(--font-display);line-height:1.25;color:var(--ink)}
.bubble .kw{color:var(--t-hibiscus);white-space:normal;overflow-wrap:anywhere}
.bubble.pop{animation:bubblein 240ms var(--ease-spring)}
.pn{font-weight:800;color:var(--ink)}

/* Personnages — structure SVG : .g-halo + .g-body > (.g-head > .g-eyes ...) ; viewBox 0 0 140 160 */
.guide{display:block;line-height:0}
.g-svg{width:100%;height:auto;overflow:visible}
.g-body{transform-origin:70px 160px;animation:breathe 3.2s var(--ease-io) infinite}
.g-head{transform-origin:70px 110px}
.g-eyes{transform-origin:70px 73px;animation:blink 4.2s linear infinite}
.guide[data-who="m"] .g-eyes{animation-delay:-1.7s}
.guide[data-who="m"] .g-body{animation-delay:-1.1s}
.m-t{transform-origin:70px 96px}
.g-hand{transform-origin:100px 136px}
.ref-row{display:flex;flex-wrap:wrap;gap:var(--s-4);align-items:flex-end;margin-bottom:var(--s-4)}
.ref-crop{width:150px;height:150px;border-radius:50%;background-image:url("../../console/public/img/avatars.jpg");background-size:768px 768px;background-color:#0E1626}
.ref-cell{display:flex;flex-direction:column;align-items:center;gap:6px;font:700 var(--fs-xs) var(--font-text);color:var(--ink-2);text-align:center;max-width:170px}
.ref-guide{width:150px;height:150px;border-radius:50%;background:#0E1626;display:grid;place-items:end center;overflow:hidden}
.ref-guide .guide{width:132px}
.guide .b-e,.guide .e-h,.guide .m-j,.guide .m-e,.guide .m-t,.guide .g-hand{display:none}
.guide[data-expr="joy"] .e-o,.guide[data-expr="joy"] .m-n{display:none}
.guide[data-expr="joy"] .e-h,.guide[data-expr="joy"] .m-j,.guide[data-expr="joy"] .g-hand{display:inline}
.guide[data-expr="enc"] .b-n,.guide[data-expr="enc"] .m-n{display:none}
.guide[data-expr="enc"] .b-e,.guide[data-expr="enc"] .m-e{display:inline}
.guide.talking .m-n,.guide.talking .m-j,.guide.talking .m-e{display:none!important}
.guide.talking .m-t{display:inline;animation:talk 140ms var(--ease-io) 6 alternate}
.guide.do-joy .g-body{animation:jump 620ms var(--ease-out)}
.guide.do-joy .g-hand{animation:wave 280ms var(--ease-io) 2 alternate}
.guide.do-nod .g-head{animation:nod 760ms var(--ease-io)}
.guide.do-dance .g-body{animation:dance 1400ms var(--ease-io) 2}
.guide.do-dance .g-hand{display:inline;animation:wave 350ms var(--ease-io) 8 alternate}

/* ===== Accueil ===== */
.home-top{display:flex;align-items:center;justify-content:space-between;padding:var(--s-2) var(--s-5) var(--s-2);flex:none;gap:var(--s-2)}
.logo{font:700 var(--fs-xl) var(--font-display);display:flex;align-items:center;gap:8px;white-space:nowrap}
.logo .bubble-ic{width:34px;height:34px;border-radius:12px 12px 12px 4px;background:var(--c-hibiscus);color:var(--on-fill);display:grid;place-items:center;font:700 20px var(--font-display)}
.logo .acc{color:var(--t-hibiscus)}
.daily{border-radius:var(--r-lg);padding:var(--s-3) var(--s-4);color:var(--on-fill);background:var(--c-mango);display:flex;gap:var(--s-3);align-items:center;flex:none}
.ring{width:56px;height:56px;flex:none;position:relative}
.ring svg{width:56px;height:56px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:800 var(--fs-xs) var(--font-text)}
.daily h3{font-size:var(--fs-base)} .daily p{margin:0;font-size:var(--fs-xs);font-weight:700}
.week{display:flex;gap:4px;margin-left:auto}
.week i{width:14px;height:14px;border-radius:var(--r-pill);background:rgba(27,20,17,.18)}
.week i.on{background:var(--on-fill)}
.sec-title{font:700 var(--fs-lg) var(--font-display);margin:var(--s-3) 0 var(--s-2);display:flex;justify-content:space-between;align-items:baseline;flex:none}
.sec-title small{font:700 var(--fs-xs) var(--font-text);color:var(--ink-2)}
.path{list-style:none;margin:0;padding:0 0 0 4px;position:relative;overflow:hidden;flex:1;min-height:0}
.path::before{content:"";position:absolute;left:35px;top:20px;bottom:0;width:6px;border-radius:3px;background:var(--surface-2)}
.lvl{position:relative;display:flex;align-items:center;gap:var(--s-3);padding:5px 0}
.node{width:64px;height:64px;border-radius:22px;flex:none;display:grid;place-items:center;position:relative;z-index:1;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.node svg.vg{width:50px;height:50px}
.node .num{position:absolute;top:-6px;left:-6px;width:24px;height:24px;border-radius:var(--r-pill);background:var(--ink);color:var(--bg);font:800 12px var(--font-text);display:grid;place-items:center}
.node .lock{position:absolute;right:-6px;bottom:-6px;width:26px;height:26px;border-radius:var(--r-pill);background:var(--ink);color:var(--bg);display:grid;place-items:center}
.node .lock .ic{width:15px;height:15px;stroke-width:2.6}
.lvl.locked .node{background:var(--surface-2)!important;box-shadow:0 5px 0 var(--d-neutral)}
.lvl.locked svg.vg{filter:grayscale(1);opacity:.5}
.lvl.current .node{animation:pulse 2s var(--ease-out) infinite}
.lvl-card{flex:1;min-width:0;background:var(--surface);border-radius:var(--r-md);padding:8px 12px;box-shadow:var(--sh-1)}
.lvl.current .lvl-card{border:2px solid var(--c-lagon)}
.lvl-card b{display:block;font:700 var(--fs-base) var(--font-display);line-height:1.2}
.lvl-meta{display:flex;align-items:center;gap:6px;font:700 var(--fs-xs) var(--font-text);color:var(--ink-2);margin-top:3px}
.stars{display:inline-flex;gap:1px}
.stars .ic{width:16px;height:16px}
.st-on{color:var(--c-mango)} .st-off{color:var(--line)}
.lvl.current .lvl-meta{color:var(--t-lagon)}
.tabbar{flex:none;display:flex;border-top:1px solid var(--line);background:var(--surface);padding:8px 12px 18px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font:800 var(--fs-xs) var(--font-text);color:var(--ink-2);padding:6px;border-radius:var(--r-md)}
.tab.on{color:var(--t-lagon);background:var(--surface-2)}

/* ===== Premier lancement ===== */
.onb h2{font-size:var(--fs-2xl);text-align:center;margin:var(--s-2) 0 var(--s-1)}
.onb .sub{text-align:center;color:var(--ink-2);font-weight:600;font-size:var(--fs-sm);margin:0 0 var(--s-3)}
.field-l{font:800 var(--fs-xs) var(--font-text);letter-spacing:.6px;text-transform:uppercase;color:var(--ink-2);margin:var(--s-3) 0 6px;display:block}
.name-in{width:100%;min-height:54px;border:2px solid var(--line);border-radius:var(--r-md);background:var(--surface);padding:0 14px;font:700 var(--fs-lg) var(--font-display);color:var(--ink)}
.name-in:focus{outline:none;border-color:var(--c-lagon)}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s-2)}
.pick{min-height:48px;border-radius:var(--r-md);border:2px solid var(--line);background:var(--surface);color:var(--ink);font:700 var(--fs-base) var(--font-text);cursor:pointer;
  box-shadow:0 var(--press) 0 var(--d-neutral);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px}
.pick[aria-pressed="true"]{border-color:var(--c-lagon);border-width:3px;background:var(--surface-2)}
.pick .guide{width:72px}
.pick .nm{font:700 var(--fs-base) var(--font-display)}

/* ===== Cartes ===== */
.card-stage{perspective:1100px;flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0}
.card3d{position:relative;height:100%;max-height:420px;min-height:300px;border:0;padding:0;background:none;cursor:pointer;transform-style:preserve-3d;
  transition:transform var(--dur-flip) var(--ease-out);width:100%;font:inherit;color:inherit}
.card3d.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--r-xl);display:flex;flex-direction:column;
  padding:var(--s-5);text-align:left;box-shadow:var(--sh-2)}
.face.front{background:var(--c-ciel);color:var(--on-fill);align-items:center;justify-content:center;text-align:center}
.face.front .plate{width:150px;height:150px}
.face.back{background:var(--surface);color:var(--ink);transform:rotateY(180deg);border:3px solid var(--c-ciel)}
.face .lang{font:800 var(--fs-xs) var(--font-text);letter-spacing:.8px;text-transform:uppercase}
.face .word{font:700 var(--fs-3xl) var(--font-display);line-height:1.1;margin:6px 0}
.face .hint{display:flex;align-items:center;gap:6px;font:700 var(--fs-sm) var(--font-text);margin-top:var(--s-3)}
.face.back .lang{color:var(--ink-2)}
.back-top{display:flex;gap:var(--s-3);align-items:center}
.back-top .plate{width:76px;height:76px;flex:none}
.ex{background:var(--surface-2);border-radius:var(--r-md);padding:var(--s-3);font-size:var(--fs-sm);margin-top:var(--s-3)}
.ex b{display:block;color:var(--ink);font-size:var(--fs-base)}
.ex span{color:var(--ink-2)}
.swipe-row{display:grid;grid-template-columns:1fr 1fr;gap:var(--s-3)}

/* ===== QCM / options ===== */
.q-img{display:flex;justify-content:center;flex:none;margin-bottom:var(--s-3)}
.q-img .plate{width:124px;height:124px}
.opts{display:grid;gap:var(--s-3)}
.opts.two{grid-template-columns:1fr 1fr}
.opt{position:relative;display:flex;align-items:center;gap:var(--s-3);min-height:56px;padding:var(--s-2) var(--s-4);border-radius:var(--r-md);
  background:var(--surface);border:2px solid var(--line);box-shadow:0 var(--press) 0 var(--d-neutral);font:700 var(--fs-lg) var(--font-text);color:var(--ink);
  text-align:left;cursor:pointer;transition:transform var(--dur-fast) var(--ease-out),box-shadow var(--dur-fast),background var(--dur-mid),border-color var(--dur-mid),opacity var(--dur-mid)}
.opt:active{transform:translateY(var(--press));box-shadow:0 0 0 var(--d-neutral)}
.opt .k{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;font:800 var(--fs-sm) var(--font-text);background:var(--surface-2);color:var(--ink-2)}
.opt .st{margin-left:auto;display:none}
.opt.is-ok{background:var(--ok-soft);border-color:var(--ok);box-shadow:0 var(--press) 0 var(--ok);color:var(--ok-text)}
.opt.is-ok .k{background:var(--ok);color:var(--on-fill)}
.opt.is-ok .st.ok{display:block}
.opt.is-ko{background:var(--ko-soft);border-color:var(--ko);box-shadow:0 var(--press) 0 var(--ko);color:var(--ko-text)}
.opt.is-ko .k{background:var(--ko);color:var(--on-fill)}
.opt.is-ko .st.ko{display:block}
.opt.is-dim{opacity:.45}
.opt small{font:600 13px var(--font-text);color:var(--ink-2)}
/* Panneau de retour */
.feedback{position:absolute;left:0;right:0;bottom:0;padding:var(--s-5) var(--s-5) var(--s-6);border-radius:var(--r-lg) var(--r-lg) 0 0;
  transform:translateY(105%);transition:transform 280ms var(--ease-out);z-index:5}
.feedback.show{transform:none}
.feedback.ok{background:var(--ok-soft);color:var(--ok-text)}
.feedback.ko{background:var(--ko-soft);color:var(--ko-text)}
.fb-title{display:flex;align-items:center;gap:10px;font:700 var(--fs-xl) var(--font-display);margin-bottom:4px}
.fb-badge{width:40px;height:40px;border-radius:var(--r-pill);display:grid;place-items:center;color:var(--on-fill);flex:none}
.feedback.ok .fb-badge{background:var(--ok)} .feedback.ko .fb-badge{background:var(--ko)}
.fb-text{font-size:var(--fs-base);margin:0 0 var(--s-4);color:var(--ink)}
.feedback.ok .btn{background:var(--ok);box-shadow:0 var(--press) 0 var(--d-ok)}
.feedback.ko .btn{background:var(--ko);box-shadow:0 var(--press) 0 var(--d-ko)}
.xp-fly{position:absolute;font:700 var(--fs-lg) var(--font-display);color:var(--t-lagon);pointer-events:none;animation:xpfly 700ms var(--ease-out) forwards;z-index:9}

/* ===== Paires ===== */
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:var(--s-3)}
.col{display:grid;gap:var(--s-2)}
.col h4{margin:0;font:800 var(--fs-xs) var(--font-text);letter-spacing:.6px;text-transform:uppercase;color:var(--ink-2)}
.tile{min-height:54px;border-radius:var(--r-md);background:var(--surface);border:2px solid var(--line);box-shadow:0 var(--press) 0 var(--d-neutral);
  font:700 var(--fs-base) var(--font-text);color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;padding:6px;
  transition:transform var(--dur-fast) var(--ease-out),box-shadow var(--dur-fast),background var(--dur-mid),opacity var(--dur-mid)}
.tile.sel{border-color:var(--c-ciel);border-width:3px;transform:translateY(-2px);box-shadow:0 6px 0 #1F7FC4}
.tile.matched{opacity:.55;cursor:default;box-shadow:none;transform:none}
.tile .ic{width:18px;height:18px}
.tile.m1{background:#C8F2EE;border-color:var(--c-lagon);color:#0B4F4A}
.tile.m2{background:#FFE7B3;border-color:var(--c-mango);color:#5C3D00}
.tile.m3{background:#FFD3DD;border-color:var(--c-hibiscus);color:#7A1030}
.tile.m4{background:#E7D9FB;border-color:var(--c-bougain);color:#4A2380}
.tile.m5{background:#D3ECFD;border-color:var(--c-ciel);color:#0D4A78}
.tile.wrong{border-color:var(--ko);background:var(--ko-soft);color:var(--ko-text);animation:shake 320ms var(--ease-out)}

/* ===== Faux-ami ===== */
.fa-card{border-radius:var(--r-xl);background:var(--c-bougain);color:var(--on-fill);padding:var(--s-5);text-align:center;box-shadow:var(--sh-2);flex:none}
.fa-card .word{display:block;font:700 var(--fs-2xl) var(--font-display);line-height:1.1}
.fa-card .eq{margin:var(--s-2) 0;font:800 var(--fs-sm) var(--font-text)}
.fa-card .fr{display:inline-block;background:rgba(255,255,255,.55);border-radius:var(--r-md);padding:6px 14px;font:700 var(--fs-xl) var(--font-display)}
.vf{display:grid;grid-template-columns:1fr 1fr;gap:var(--s-3);margin-top:var(--s-4)}
.vf .opt{flex-direction:column;justify-content:center;text-align:center;min-height:92px;gap:2px;font-size:var(--fs-base)}
.vf .opt .ic{width:28px;height:28px}

/* ===== Proverbe ===== */
.prov{position:relative;background:var(--surface);border-radius:var(--r-xl);padding:var(--s-6) var(--s-5) var(--s-4);box-shadow:var(--sh-1);border-left:8px solid var(--c-flamboyant);margin-top:var(--s-3);flex:none}
.prov .qm{position:absolute;top:-18px;left:16px;width:40px;height:40px;border-radius:var(--r-pill);background:var(--c-flamboyant);color:var(--on-fill);display:grid;place-items:center}
.prov p{margin:0;font:600 var(--fs-xl) var(--font-display);line-height:1.45}
.gap{display:inline-block;min-width:96px;border-bottom:4px dashed var(--c-flamboyant);margin:0 4px;text-align:center;color:var(--t-hibiscus)}
.prov small{display:block;margin-top:var(--s-2);color:var(--ink-2);font-size:var(--fs-sm)}

/* ===== Fin de niveau ===== */
.end{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;justify-content:center;gap:var(--s-2);position:relative}
.burst{position:absolute;top:0;left:50%;width:340px;height:340px;margin-left:-170px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,182,39,.35) 0,rgba(255,182,39,0) 65%);z-index:0}
.big-stars{display:flex;gap:6px;align-items:flex-end;position:relative;z-index:1}
.big-stars .ic{width:56px;height:56px;filter:drop-shadow(0 4px 0 rgba(0,0,0,.15))}
.big-stars .mid .ic{width:74px;height:74px}
.big-stars span{display:block}
.big-stars span.in{animation:starin 420ms var(--ease-spring) both}
.big-stars span:nth-child(2).in{animation-delay:250ms} .big-stars span:nth-child(3).in{animation-delay:500ms}
.end .guide{width:132px;position:relative;z-index:1}
.end h2{font-size:var(--fs-2xl);position:relative;z-index:1}
.end .bubble{flex:none;width:100%;margin:0;text-align:left}
.end .bubble::before{left:50%;top:-9px;bottom:auto;margin-left:-7px;transform:rotate(135deg)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s-2);width:100%}
.stat{border-radius:var(--r-md);padding:var(--s-2) 6px;color:var(--on-fill);display:flex;flex-direction:column;align-items:center;gap:0}
.stat small{font:800 11px var(--font-text);letter-spacing:.5px;text-transform:uppercase}
.stat b{font:700 var(--fs-xl) var(--font-display)}
.stat .ic{width:20px;height:20px}

/* ===== Lexique ===== */
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:2px solid var(--line);border-radius:var(--r-md);padding:0 12px;min-height:54px;flex:none}
.search:focus-within{border-color:var(--c-lagon)}
.search input{flex:1;min-width:0;border:0;background:none;font:700 var(--fs-base) var(--font-text);color:var(--ink);outline:none}
.search .ic{color:var(--ink-2)}
.dir{display:flex;margin:var(--s-3) 0;background:var(--surface-2);border-radius:var(--r-pill);padding:4px;flex:none}
.dir button{flex:1;border:0;background:none;border-radius:var(--r-pill);min-height:40px;font:800 var(--fs-sm) var(--font-text);color:var(--ink-2);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.dir button[aria-pressed="true"]{background:var(--c-lagon);color:var(--on-fill)}
.dir .ic{width:16px;height:16px}
.dir button{gap:3px;padding:0 4px}
@media (max-width:420px){.home-top .logo .bubble-ic{display:none}}
.count{font:700 var(--fs-xs) var(--font-text);color:var(--ink-2);margin:0 0 var(--s-2)}
.results{list-style:none;margin:0;padding:0;display:grid;gap:var(--s-2);overflow:hidden}
.res{display:flex;align-items:center;gap:var(--s-3);background:var(--surface);border-radius:var(--r-md);padding:10px 12px;box-shadow:var(--sh-1)}
.res .dot{width:10px;height:40px;border-radius:5px;flex:none}
.res .plate{width:44px;height:44px;border-radius:12px;flex:none}
.res div{flex:1;min-width:0}
.res b{display:block;font:700 var(--fs-lg) var(--font-display)}
.res span{color:var(--ink-2);font-size:var(--fs-sm);font-weight:600}
.res mark{background:var(--c-mango);color:var(--on-fill);border-radius:4px;padding:0 2px}
.res .lv{font:800 11px var(--font-text);color:var(--ink-2);white-space:nowrap}

.confetti{position:absolute;width:10px;height:14px;border-radius:3px;pointer-events:none;z-index:8;animation:confetti 900ms var(--ease-out) forwards}

/* ===== Animations ===== */
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes glow{0%,100%{box-shadow:0 var(--press) 0 var(--ok),0 0 0 0 rgba(34,181,115,.5)}50%{box-shadow:0 var(--press) 0 var(--ok),0 0 0 10px rgba(34,181,115,0)}}
@keyframes pulse{0%{box-shadow:0 5px 0 rgba(0,0,0,.18),0 0 0 0 rgba(255,107,53,.55)}70%{box-shadow:0 5px 0 rgba(0,0,0,.18),0 0 0 16px rgba(255,107,53,0)}100%{box-shadow:0 5px 0 rgba(0,0,0,.18),0 0 0 0 rgba(255,107,53,0)}}
@keyframes starin{0%{transform:scale(0) rotate(-25deg);opacity:0}70%{transform:scale(1.25) rotate(4deg);opacity:1}100%{transform:scale(1) rotate(0)}}
@keyframes xpfly{0%{transform:translateY(0) scale(.8);opacity:0}25%{opacity:1;transform:translateY(-10px) scale(1.1)}100%{transform:translateY(-60px) scale(1);opacity:0}}
@keyframes confetti{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}
@keyframes bubblein{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
/* Personnages */
@keyframes breathe{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-1.5px) scale(1.015)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes talk{from{transform:scaleY(.35)}to{transform:scaleY(1)}}
@keyframes jump{0%{transform:translateY(0) scaleY(1)}20%{transform:translateY(1.5px) scaleY(.97)}55%{transform:translateY(-8px) scaleY(1.02)}80%{transform:translateY(0) scaleY(.99)}100%{transform:translateY(0) scaleY(1)}}
@keyframes wave{from{transform:rotate(0)}to{transform:rotate(-16deg)}}
@keyframes nod{0%{transform:none}25%{transform:translateY(3px) rotate(4deg)}50%{transform:translateY(0) rotate(4deg)}75%{transform:translateY(3px) rotate(4deg)}100%{transform:none}}
@keyframes dance{0%{transform:none}25%{transform:translateY(-3px) rotate(-5deg)}50%{transform:translateY(0) rotate(0)}75%{transform:translateY(-3px) rotate(5deg)}100%{transform:none}}
.anim-pop{animation:pop var(--dur-mid) var(--ease-spring)}
.anim-shake{animation:shake 320ms var(--ease-out)}
.anim-glow{animation:glow 700ms var(--ease-out) 2}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:150ms!important}
  .card3d{transition:opacity 150ms!important}
  .confetti,.xp-fly{display:none}
  .guide .g-svg *{animation:none!important}
  .feedback .timer{display:none}
  .xp-cost{display:none}
  .toast::after{display:none}
}

/* ===== Écrans 9 à 13 (maquette de Léa, 28/10) : jokers, révision, écrire, construire, succès ===== */
/* ===== Barre d'onglets à 4 entrées (Parcours, Lexique, Succès, Réglages) ===== */
.tabbar.four .tab{padding:6px 2px}
/* ===== Révision intelligente ===== */
.rev-card{display:flex;align-items:center;gap:12px;width:100%;margin-top:var(--s-3);padding:10px 14px;border-radius:var(--r-lg);flex:none;text-align:left;cursor:pointer;
  background:var(--surface);border:2px solid var(--c-lagon);box-shadow:0 var(--press) 0 var(--d-lagon);font:inherit;color:var(--ink)}
.rev-card:active{transform:translateY(var(--press));box-shadow:0 0 0 var(--d-lagon)}
.rev-card .rv-ic{width:44px;height:44px;border-radius:14px;background:var(--c-lagon);color:var(--on-fill);display:grid;place-items:center;flex:none}
.rev-card .rv-t{flex:1;min-width:0}
.rev-card b{display:block;font:700 var(--fs-base) var(--font-display);line-height:1.2}
.rev-card .rv-s{font:700 var(--fs-xs) var(--font-text);color:var(--ink-2)}
.rev-card .rv-n{font:800 var(--fs-xs) var(--font-text);color:var(--t-lagon)}
.x2{flex:none;display:inline-flex;align-items:center;font:800 var(--fs-xs) var(--font-text);background:var(--c-mango);color:var(--on-fill);border-radius:var(--r-pill);padding:4px 9px}
.rev-card.done{background:var(--surface-2);border-color:var(--surface-2);box-shadow:none;cursor:default}
.rev-card.done:active{transform:none}
.rev-card.done .rv-ic{background:var(--ok)}
.rev-card.lec .rv-ic{background:var(--c-mango)}
/* Jauge de maîtrise : 5 crans, le nombre est toujours écrit à côté */
.gauge{display:inline-flex;align-items:center;gap:3px}
.gauge i{width:10px;height:6px;border-radius:3px;border:1.5px solid var(--ink-2);box-sizing:border-box}
.gauge i.on{background:var(--t-lagon);border-color:var(--t-lagon)}
.gauge .g-lbl{font:800 11px var(--font-text);color:var(--ink-2);margin-left:4px;white-space:nowrap}
.gauge.lg i{width:18px;height:8px;border-radius:4px}
.gauge.lg .g-lbl{font-size:var(--fs-xs)}
.gauge.on-fill i{border-color:var(--on-fill)}
.gauge.on-fill i.on{background:var(--on-fill)}
.gauge.on-fill .g-lbl{color:var(--on-fill)}
.gauge i.pop{animation:pippop 260ms var(--ease-spring)}
.gauge i.drop{animation:pipdrop 320ms var(--ease-out)}
.fb-gauge{display:flex;align-items:center;gap:8px;margin:-6px 0 var(--s-4);font:700 var(--fs-sm) var(--font-text);color:var(--ink)}
@keyframes pippop{0%{transform:scale(1)}50%{transform:scale(1.5)}100%{transform:scale(1)}}
@keyframes pipdrop{0%{transform:scale(1.35);background:var(--ko);border-color:var(--ko)}100%{transform:scale(1)}}
/* ===== Écrire la réponse ===== */
.prompt{flex:none;border-radius:var(--r-lg);background:var(--c-ciel);color:var(--on-fill);padding:12px 16px;margin-top:var(--s-2)}
.prompt .lang{display:block;font:800 var(--fs-xs) var(--font-text);letter-spacing:.8px;text-transform:uppercase}
.prompt .word{display:block;font:700 var(--fs-2xl) var(--font-display);line-height:1.15}
.answer-in{width:100%;min-height:56px;margin-top:var(--s-3);padding:0 16px;border:2px solid var(--line);border-radius:var(--r-md);background:var(--surface);
  font:700 var(--fs-xl) var(--font-display);color:var(--ink);caret-color:var(--t-lagon)}
.answer-in:focus,.answer-in.focus{outline:none;border:3px solid var(--c-lagon);padding:0 15px}
.answer-in.is-ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ok-text)}
.answer-in.is-ko{border-color:var(--ko);background:var(--ko-soft);color:var(--ko-text)}
.answer-in::placeholder{color:var(--ink-2);font-weight:600}
.check-row{flex:none;padding:var(--s-3) 0}
.diff{background:var(--c-mango);color:var(--on-fill);border-radius:4px;padding:0 2px}
.typed{font:600 var(--fs-sm) var(--font-text);color:var(--ink-2)}
.typed s{text-decoration-thickness:2px}
/* ===== Construire la phrase ===== */
.slots{flex:none;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;min-height:106px;padding:2px 0;margin-top:var(--s-3);
  background:linear-gradient(var(--line),var(--line)) 0 50px/100% 2px no-repeat,linear-gradient(var(--line),var(--line)) 0 102px/100% 2px no-repeat}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:var(--s-6)}
.tag{min-height:44px;padding:0 14px;border-radius:12px;background:var(--surface);border:2px solid var(--line);box-shadow:0 var(--press) 0 var(--d-neutral);
  font:700 var(--fs-base) var(--font-text);color:var(--ink);cursor:pointer;white-space:nowrap;transition:transform var(--dur-fast) var(--ease-out),box-shadow var(--dur-fast)}
.tag:active{transform:translateY(var(--press));box-shadow:0 0 0 var(--d-neutral)}
.tag.ghost{background:var(--surface-2);border-color:var(--surface-2);box-shadow:none;color:transparent;cursor:default}
.slots .tag.is-ok{background:var(--ok-soft);border-color:var(--ok);box-shadow:0 var(--press) 0 var(--ok);color:var(--ok-text)}
.slots .tag.is-ko{background:var(--ko-soft);border-color:var(--ko);box-shadow:0 var(--press) 0 var(--ko);color:var(--ko-text)}
.fr-sentence{flex:none;font:700 var(--fs-lg) var(--font-display);line-height:1.3;color:var(--ink);margin-top:var(--s-2)}
/* ===== Succès et badges ===== */
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s-5) var(--s-3);padding:var(--s-3) 0 var(--s-6)}
.badge{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;border:0;background:none;padding:0;font:inherit;color:inherit;cursor:pointer;min-width:0}
.medal{position:relative;width:76px;height:76px;border-radius:50%;display:grid;place-items:center;flex:none;
  box-shadow:0 5px 0 rgba(0,0,0,.18),inset 0 0 0 5px rgba(255,255,255,.42)}
.medal svg{width:50px;height:50px}
.medal .n{position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);padding:1px 8px;border-radius:var(--r-pill);background:var(--ink);color:var(--bg);font:700 12px var(--font-display);white-space:nowrap}
.medal .lock{position:absolute;right:-4px;top:-2px;width:26px;height:26px;border-radius:var(--r-pill);background:var(--ink);color:var(--bg);display:grid;place-items:center}
.medal .lock .ic{width:15px;height:15px;stroke-width:2.6}
.badge b{font:700 var(--fs-sm) var(--font-display);line-height:1.15;color:var(--ink);margin-top:4px}
.badge small{font:700 11px var(--font-text);line-height:1.3;color:var(--ink-2)}
.badge.locked .medal{background:var(--surface-2)!important;box-shadow:0 5px 0 var(--d-neutral)}
.badge.locked .medal svg{filter:grayscale(1);opacity:.45}
.badge.locked .medal .n{background:var(--ink-2)}
.b-count{font:700 var(--fs-xs) var(--font-text);color:var(--ink-2)}
/* Fiche d'un badge (feuille montante) */
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-radius:var(--r-xl) var(--r-xl) 0 0;box-shadow:var(--sh-2);
  padding:var(--s-6) var(--s-5) var(--s-6);display:flex;flex-direction:column;align-items:center;text-align:center;gap:var(--s-2);animation:sheetin 300ms var(--ease-out)}
.sheet .grip{width:40px;height:5px;border-radius:3px;background:var(--line);margin:-8px 0 var(--s-2)}
.sheet .medal{width:120px;height:120px}.sheet .medal svg{width:80px;height:80px}
.sheet h3{font-size:var(--fs-xl);margin-top:var(--s-3)}
.sheet p{margin:0;color:var(--ink-2);font-weight:600}
.sheet .btn{margin-top:var(--s-4)}
.scrim{position:absolute;inset:0;z-index:5;background:rgba(22,18,15,.45)}
/* Déblocage en cours de jeu : bandeau qui descend, n'interrompt pas la question */
.toast{position:absolute;left:12px;right:12px;top:40px;z-index:7;display:flex;align-items:center;gap:12px;padding:10px 14px 10px 10px;border-radius:var(--r-lg);
  background:var(--surface);border:2px solid var(--c-mango);box-shadow:var(--sh-2);animation:toastin 420ms var(--ease-spring) both;cursor:pointer;overflow:hidden}
.toast .medal{width:52px;height:52px;box-shadow:0 3px 0 rgba(0,0,0,.18),inset 0 0 0 3px rgba(255,255,255,.42);animation:badgein 600ms var(--ease-spring) 150ms both}
.toast .medal svg{width:34px;height:34px}
.toast .t-k{display:block;font:800 11px var(--font-text);letter-spacing:.6px;text-transform:uppercase;color:var(--t-mango)}
.toast b{display:block;font:700 var(--fs-base) var(--font-display);line-height:1.2;color:var(--ink)}
.toast::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-50%;background:linear-gradient(100deg,rgba(255,255,255,0),rgba(255,255,255,.55),rgba(255,255,255,0));animation:shine 700ms var(--ease-out) 450ms both}
.toast.out{animation:toastout 260ms cubic-bezier(.4,0,1,1) forwards}
@keyframes sheetin{from{transform:translateY(100%)}to{transform:none}}
@keyframes toastin{from{transform:translateY(-140%)}to{transform:none}}
@keyframes toastout{to{transform:translateY(-140%);opacity:0}}
@keyframes badgein{0%{transform:scale(0) rotate(-30deg)}70%{transform:scale(1.15) rotate(6deg)}100%{transform:scale(1) rotate(0)}}
@keyframes shine{from{left:-50%}to{left:110%}}

/* ===== Jokers (Indice / Passer) — barre fixe en bas des écrans QCM, Faux-ami, Proverbe, Paires ===== */
.scr-foot.jokers{display:grid;grid-template-columns:1fr 1fr;gap:var(--s-3);padding-top:var(--s-4)}
.joker{position:relative;display:flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:0 8px;border-radius:var(--r-md);
  background:var(--surface);border:2px solid var(--line);box-shadow:0 var(--press) 0 var(--d-neutral);white-space:nowrap;
  font:700 var(--fs-base) var(--font-display);color:var(--ink);cursor:pointer;
  transition:transform var(--dur-fast) var(--ease-out),box-shadow var(--dur-fast) var(--ease-out),background var(--dur-mid),color var(--dur-mid)}
.joker:active:not([aria-disabled="true"]){transform:translateY(var(--press));box-shadow:0 0 0 var(--d-neutral)}
.joker > .ic{width:22px;height:22px}
.joker.j-hint > .ic{color:var(--t-mango)}
.joker.j-skip > .ic{color:var(--t-lagon)}
/* Coût : pastille posée sur le coin haut-droit du bouton, pour ne pas prendre de largeur */
.joker .cost{position:absolute;top:-11px;right:-6px;display:inline-flex;align-items:center;gap:2px;padding:1px 8px 1px 5px;border-radius:var(--r-pill);
  background:var(--surface);border:2px solid var(--line);box-shadow:var(--sh-1);font:800 var(--fs-xs) var(--font-text);color:var(--ink)}
.joker .cost .ic{width:14px;height:14px;color:var(--c-ciel)}
.joker[aria-disabled="true"]{background:var(--surface-2);border-color:var(--surface-2);color:var(--ink-2);box-shadow:0 var(--press) 0 var(--d-neutral);cursor:not-allowed}
.joker[aria-disabled="true"] > .ic,.joker[aria-disabled="true"] .cost .ic{color:var(--ink-2)}
.joker .cost[hidden]{display:none}
.joker[aria-disabled="true"] .cost{background:var(--surface-2);color:var(--ink-2);box-shadow:none}
.joker .cost.nope{animation:shake 320ms var(--ease-out)}
/* Indice déployé : dans la bulle du guide, sous la question */
.hint{display:flex;gap:10px;align-items:center;margin-top:8px;padding:8px 10px;border-radius:12px;background:var(--surface-2);animation:hintin 280ms var(--ease-out)}
.hint .plate{width:64px;height:64px;border-radius:12px;flex:none}
.hint .h-lbl{display:flex;align-items:center;gap:4px;font:800 11px var(--font-text);letter-spacing:.6px;text-transform:uppercase;color:var(--t-mango)}
.hint .h-lbl .ic{width:14px;height:14px}
.hint p{margin:2px 0 0;font:600 var(--fs-sm) var(--font-text);color:var(--ink)}
.hint .letter{font:700 var(--fs-xl) var(--font-display);color:var(--ink)}
/* Dépense d'XP sur le compteur */
.chip.xp.spend{animation:spend 260ms var(--ease-spring)}
.xp-cost{position:absolute;font:700 var(--fs-base) var(--font-display);color:var(--t-mango);pointer-events:none;z-index:9;animation:xpcost 700ms var(--ease-out) forwards}
/* Retour après « Passer » : neutre, ni vert ni rouge */
.opt.is-shown{background:var(--info-soft);border-color:var(--c-ciel);box-shadow:0 var(--press) 0 var(--d-info);color:var(--info-text)}
.opt.is-shown .k{background:var(--c-ciel);color:var(--on-fill)}
.feedback.skip{background:var(--info-soft);color:var(--info-text)}
.feedback.skip .fb-badge{background:var(--c-ciel)}
.feedback.skip .btn{position:relative;overflow:hidden;background:var(--c-ciel);box-shadow:0 var(--press) 0 var(--d-info)}
.feedback .timer{position:absolute;left:0;bottom:0;height:5px;width:100%;transform-origin:0 50%;background:rgba(27,20,17,.35);animation:timer 2500ms linear forwards}
/* Gestes des guides propres aux jokers */
.guide.do-lean .g-head{animation:lean 300ms var(--ease-out) forwards}
.guide.do-shake .g-head{animation:headshake 520ms var(--ease-io)}
@keyframes hintin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@keyframes spend{0%{transform:scale(1)}40%{transform:scale(.9)}100%{transform:scale(1)}}
@keyframes xpcost{0%{opacity:0;transform:translateY(-4px)}20%{opacity:1}100%{opacity:0;transform:translateY(24px)}}
@keyframes timer{from{transform:scaleX(1)}to{transform:scaleX(0)}}
@keyframes lean{to{transform:translateX(3px) rotate(-6deg)}}
@keyframes headshake{0%,100%{transform:none}20%{transform:rotate(-5deg)}40%{transform:rotate(5deg)}60%{transform:rotate(-4deg)}80%{transform:rotate(3deg)}}

/* ===================== ADAPTATION PLEIN ÉCRAN (jeu) ===================== */
html{-webkit-text-size-adjust:100%}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-text);font-size:var(--fs-base);line-height:1.45;
  padding-inline:0;overflow-x:hidden}
h1,h2,h3{font-family:var(--font-display);font-weight:600;margin:0}
button{-webkit-tap-highlight-color:transparent}
/* L'écran occupe toute la fenêtre ; la marge d'écran de 20 px (charte) est portée par chaque bloc */
.screen{width:100%;max-width:none;margin:0;height:100vh;height:100dvh;border-radius:0}
.statusbar{height:max(10px,env(safe-area-inset-top,0px))}
.scr-body,.game-head,.home-top,.scr-foot,.tabbar,.feedback{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.scr-body{overflow:hidden}
.scr-foot{padding-bottom:calc(var(--s-6) + env(safe-area-inset-bottom,0px))}
.tabbar{padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
.feedback{left:0;right:0;padding-bottom:calc(var(--s-6) + env(safe-area-inset-bottom,0px))}
/* Le parcours et les résultats défilent dans leur propre zone */
.path,.results{flex:1;min-height:0;overflow-y:auto}
.path{margin:0 -20px;padding:12px 20px 24px 24px}
.path::before{left:55px;top:32px}
.results{margin:0 -20px;padding:4px 20px 16px}
.say{flex:none}
.bubble.hide{visibility:hidden}
/* Éléments interactifs que la maquette dessinait en <span>/<li> */
button.tab{border:0;background:none;cursor:pointer;min-height:44px}
button.tab.on{background:var(--surface-2)}
.lvl[role="button"]{cursor:pointer;border-radius:var(--r-md)}
.lvl[aria-disabled="true"]{cursor:default}
.lvl:focus-visible,.tab:focus-visible,.icon-btn:focus-visible,.dir button:focus-visible,.name-in:focus-visible{outline:3px solid var(--c-ciel);outline-offset:3px}
.btn:disabled{opacity:1;background:var(--surface-2);color:var(--ink-2);box-shadow:0 var(--press) 0 var(--d-neutral);cursor:not-allowed}
.btn:disabled:active{transform:none;box-shadow:0 var(--press) 0 var(--d-neutral)}
svg.ic.fill.st-off{fill:none;stroke:var(--ink-2);stroke-width:1.8}
.daily h3{white-space:nowrap}
.week{gap:3px}
.week i{width:10px;height:10px}
.lvl.unlocking svg.vg{transition:filter 400ms var(--ease-out),opacity 400ms var(--ease-out)}
.card-stage{touch-action:pan-y}
.face.back{overflow-y:auto}
.face .word.long{font-size:var(--fs-2xl)}
.res div span{display:block}
.opt .tx{min-width:0}
.vf .opt .st{margin:0 auto}
.prov p .gap{min-width:72px}
/* Bandeau de badge et fiche : posés sur la page, au-dessus de l'écran, pour survivre au changement d'écran */
.toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px))}
.scrim{position:fixed}
.sheet{position:fixed;padding-bottom:calc(var(--s-6) + env(safe-area-inset-bottom,0px))}
/* Écrire : clavier ouvert, le guide se masque et la consigne remonte au-dessus du champ */
.prompt{display:none}
.screen.writing .prompt{display:block}
.screen.writing .say{display:none}
.toast:focus-visible,.badge:focus-visible,.tag:focus-visible,.joker:focus-visible,.rev-card:focus-visible,.answer-in:focus-visible{outline:3px solid var(--c-ciel);outline-offset:3px}
.check-row[hidden]{display:none}

  function dt(s){return esc(fmt(s));}

  /* Typographie française à l'affichage : espace fine insécable (U+202F) avant ? ! : ; et à l'intérieur de « ».
     S'applique aux nœuds de texte affichés (jamais aux valeurs des champs, ni aux données, ni aux comparaisons).
     Exceptions : 10:30 (chiffre:chiffre), :// (adresse), ?! (ponctuation double, pas d'espace entre les deux). */
  function typo(s){
    return String(s)
      .replace(/(^|[^\s\u00A0\u202F?!:;«])[ \u00A0\u202F]?([?!:;])/g,function(m,p,c,off,str){
        var nx=str.charAt(off+m.length);
        if(c===':'&&(nx==='/'||(/\d/.test(p)&&/\d/.test(nx))))return m;
        return p+'\u202F'+c;
      })
      .replace(/«[ \u00A0\u202F]*/g,'«\u202F').replace(/[ \u00A0\u202F]*»/g,'\u202F»');
  }

    var p=n.parentNode;if(!p||p.nodeType!==1||TYPO_SKIP[p.nodeName]||(p.closest&&p.closest('svg,[contenteditable]')))return;
    var v=n.nodeValue,t=typo(v);if(t!==v)n.nodeValue=t;
  }

  function pad(n){return (n<10?'0':'')+n;}

  var toastQ=[],toastBusy=false;
  /* Vérifie tous les badges ; les nouveaux passent en bandeau, un par un */
  function checkBadges(delay){
    var fresh=[];
    BADGES.forEach(function(b){if(!S.badges[b.id]&&b.val()>=b.goal){S.badges[b.id]=today();fresh.push(b);}});
    if(!fresh.length)return;
    save();

  function runToasts(){
    if(toastBusy||!toastQ.length)return;

    var b=toastQ.shift(),t=document.createElement('div');

    t.innerHTML=medalHTML(b,false,false)+'<span><span class="t-k">Nouveau badge</span><b>'+esc(b.t)+'</b></span>';
    document.body.appendChild(t);
    var g=app.querySelector('.say .guide, .end .guide');if(g){act(g,'joy');relax(g,1600);}
    var gone=false;
    function close(){if(gone)return;gone=true;t.classList.add('out');setTimeout(function(){t.remove();toastBusy=false;runToasts();},reduced?150:260);}
    var timer=setTimeout(close,reduced?4000:3420);
    t.addEventListener('click',function(){clearTimeout(timer);close();openBadge(b);});

  /* ======================================================================
     NIVEAU — cartes puis session d'exercices ; RÉVISION — exercices seuls
     ====================================================================== */
  var L=null,C=null,autoT=null;
  function themeEntries(t){return DATA.filter(function(e){return e.theme===t&&e.type!=='replique';});}
  function startLevel(i){
    var t=THEMES[i],entries=themeEntries(t.id);
    L={mode:'level',i:i,t:t,entries:entries,ci:0,seen:{},review:{},ex:null,ei:0,good:0,total:0,xp:0,miss:0};
    renderCards();
  }
  function startRevision(){
    var due=dueWords().slice(0,REV_MAX);
    if(!due.length)return;
    L={mode:'rev',entries:due,review:{},ex:buildRevSession(due),ei:0,good:0,total:0,xp:0,miss:0};
    renderExercise();
  }
  function xpPer(){return L&&L.mode==='rev'?XP_PER*2:XP_PER;}
  /* Leçon : les 10 cartes des mots, puis la carte de la phrase type, puis les exercices */
  function startLesson(n){
    var l=null;LECONS.forEach(function(x){if(x.n===n)l=x;});if(!l)return;
    var p=l.pattern,ex=p.exemples||[];
    var pc={id:p.id,theme:l.theme,type:'phrase-type',cr:p.cr.replace(/\{[^}]+\}/g,'…'),fr:p.fr.replace(/\{[^}]+\}/g,'…'),
      note:p.note,exs:ex};
    L={mode:'lesson',l:l,t:{id:l.theme,name:'Leçon '+l.n},entries:l.mots.concat([pc]),words:l.mots,ci:0,seen:{},review:{},ex:null,ei:0,good:0,total:0,xp:0,miss:0};

  /* ---------- Éligibilité des exercices ---------- */
  function wc(s){return String(s).trim().split(/\s+/).length;}
  function writeable(e){return (e.type==='mot'||e.type==='expression')&&crOf(e).length<=25&&!/\{prenom\}/.test(e.cr);}
  /* Phrases à construire : expressions et proverbes, et exemples, d'au moins trois mots */
  function sentencesOf(e){
    var out=[];
    if(!e||e.type==='replique')return out;
    if((e.type==='expression'||e.type==='proverbe')&&wc(crOf(e))>=3&&!/\{prenom\}/.test(e.cr+' '+e.fr))out.push({e:e,cr:crOf(e),fr:frOf(e)});
    if(e.exemple_cr&&e.exemple_fr&&wc(e.exemple_cr)>=3&&!/\{prenom\}/.test(e.exemple_cr+' '+e.exemple_fr))out.push({e:e,cr:e.exemple_cr,fr:e.exemple_fr});
    return out;
  }
  function isProv(e){return e.type==='proverbe'&&e.mot_cache&&e.cr.indexOf(e.mot_cache)>=0;}
  function isFa(e){return e.type==='faux-ami'&&!!e.piege;}

  /* ---------- Composition de la session de niveau (~10 exercices) ---------- */
  function buildSession(){
    var all=L.entries,used={};
    var prior=function(arr){var r=shuffle(arr);return r.filter(function(e){return L.review[e.id];}).concat(r.filter(function(e){return !L.review[e.id];}));};
    var fresh=function(arr){return arr.filter(function(e){return !used[e.id];}).concat(arr.filter(function(e){return used[e.id];}));};
    var prov=all.filter(isProv),fa=all.filter(isFa);
    var specialKind=prov.length?'prov':(fa.length?'vf':null),specials=[];
    if(specialKind)specials=prior(specialKind==='prov'?prov:fa).slice(0,4);
    specials.forEach(function(e){used[e.id]=1;});
    var pick12=function(n){return n?(n>=2&&Math.random()<.5?2:1):0;};
    var wr=fresh(prior(all.filter(writeable))),nW=pick12(wr.length),writes=wr.slice(0,nW);
    writes.forEach(function(e){used[e.id]=1;});
    var sents=[];all.forEach(function(e){sents=sents.concat(sentencesOf(e));});
    sents=shuffle(sents);var nB=pick12(sents.length),builds=sents.slice(0,nB);
    var qpool=all.filter(function(e){return e.type!=='proverbe';});if(!qpool.length)qpool=all;
    var qOrder=fresh(prior(qpool)),nQ=SESSION_LEN-1-specials.length-nW-nB,qs=[];
    for(var i=0;i<nQ&&qOrder.length;i++)qs.push(qOrder[i%qOrder.length]);
    var dir=Math.random()<.5?0:1;
    var list=shuffle(specials.map(function(e){return {kind:specialKind,e:e};})
      .concat(writes.map(function(e){return {kind:'write',e:e};}))
      .concat(builds.map(function(s){return {kind:'build',e:s.e,s:s};}))
      .concat(qs.map(function(e){return {kind:'qcm',e:e,dir:(dir++)%2};})));
    list.splice(Math.min(4,list.length),0,{kind:'pairs'});
    return list;
  }
  /* ---------- Session de révision : les mots dus, exercices mélangés ---------- */
  function buildRevSession(due){
    var list=[],rest=due.slice();
    if(rest.length>=7){
      var short=rest.filter(function(e){return e.type!=='proverbe'&&frOf(e).length<=24&&crOf(e).length<=20;}),items=[],sf={},sc={};
      short.forEach(function(e){var a=norm(frOf(e)),c=norm(crOf(e));if(items.length<5&&!sf[a]&&!sc[c]){sf[a]=sc[c]=1;items.push(e);}});
      if(items.length===5){list.push({kind:'pairs',items:items});rest=rest.filter(function(e){return items.indexOf(e)<0;});}
    }
    var dir=0;
    rest.forEach(function(e){
      var k=['qcm'];
      if(isProv(e))k.push('prov','prov');
      if(isFa(e))k.push('vf','vf');
      if(writeable(e))k.push('write');
      var ss=sentencesOf(e);if(ss.length)k.push('build');
      var kind=k[Math.floor(Math.random()*k.length)];
      if(kind==='build')list.push({kind:'build',e:e,s:ss[Math.floor(Math.random()*ss.length)]});
      else list.push({kind:kind,e:e,dir:(dir++)%2});
    });
    return shuffle(list);
  }

  /* ---------- Exercices : enveloppe commune ---------- */

  /* Bonne ou mauvaise réponse : comptage, XP, jauges, guide, effets (barème de la charte) */
  function scored(ok,fromEl,entries,noBubble,ko){
    C.answered=true;syncJokers();

  /* Choix multiples : verrouille, marque la réponse et la bonne */
  function bindOpts(opts,rightIdx,onPick,fbFn,entry){
    opts.forEach(function(o,i){o.addEventListener('click',function(){
      if(C.answered)return;

  function distinct(list,keyFn){var seen={},out=[];list.forEach(function(e){var k=norm(keyFn(e));if(k&&!seen[k]){seen[k]=1;out.push(e);}});return out;}
  function distractors(target,keyFn,n){
    var pool=themeEntries(target.theme),tk=norm(keyFn(target));
    var same=pool.filter(function(e){return e!==target&&e.type===target.type&&norm(keyFn(e))!==tk;});
    var other=pool.filter(function(e){return e!==target&&e.type!==target.type&&norm(keyFn(e))!==tk&&e.type!=='proverbe';});
    return distinct(shuffle(same).concat(shuffle(other)),keyFn).slice(0,n);
  }

  /* ---------- Jokers : Indice (10 XP) et Passer (30 XP) ---------- */

  function syncJokers(){

  function spend(cost){

  /* Il manque des XP : la pastille tremble, le guide dit non de la tête, la bulle l'explique 2 000 ms */
  function lacking(btn,cost,what){

    clearTimeout(b._lt);

  function restoreBubble(){var b=B();if(b&&b._keep!=null){clearTimeout(b._lt);b.innerHTML=b._keep;b._keep=null;}}
  function bindJokers(){

  /* Indice : 1. l'illustration de la bonne réponse si elle n'est pas déjà à l'écran,

     (les deux premières si une autre réponse proposée commence par la même lettre). */
  function makeHint(e,answer,imgShown,options){
    return function(){
      var b=B();if(!b)return;
      var h='';
      if(e&&hasIl(e)&&!imgShown)h='<span class="plate"><svg aria-hidden="true"><use href="#il-'+esc(e.illustration)+'"/></svg></span><div><span class="h-lbl">'+icon('i-bulb')+'Indice</span><p>Regarde bien l\'image.</p></div>';
      else if(e&&e.note&&norm(e.note).indexOf(norm(answer))<0)h='<div><span class="h-lbl">'+icon('i-bulb')+'Indice</span><p>'+dt(e.note)+'</p></div>';
      else{
        var a0=norm(answer).charAt(0),n=(options||[]).some(function(o){return o!==answer&&norm(o).charAt(0)===a0;})?2:1;
        h='<div><span class="h-lbl">'+icon('i-bulb')+'Indice</span><p>Commence par <span class="letter">'+qq(esc(answer.slice(0,n).toLowerCase())+'…')+'</span></p></div>';
      }
      b.insertAdjacentHTML('beforeend','<div class="hint">'+h+'</div>');
    };
  }
  function skipFb(answerHTML){

  /* ---------- Écran 3 — QCM ---------- */
  function exQcm(x){

    },e);

  /* ---------- Remplis la phrase : un exemple validé, son mot caché, quatre choix du même type ---------- */
  function exFill(x){
    var f=x.f,kind=L.l.pattern.kind,e=byId(f.mot);
    var keyOf=function(m){return kind==='det'?m.det:m.cr;};

    choices=shuffle(choices);
    var right=choices.indexOf(f.slot);

    var holed=esc(f.cr).replace(re,function(m,p){return p+'<span style="color:var(--t-hibiscus)">_____</span>';});

    },e);

    C.skip=function(){skipFb(dt(f.cr));};
  }

  /* ---------- Écran 4 — Paires ---------- */
  function exPairs(x){
    var pick=x.items;
    if(!pick){
      var pool=L.entries.filter(function(e){return e.type!=='proverbe';});
      var short=pool.filter(function(e){return frOf(e).length<=24&&crOf(e).length<=20;});
      var src=shuffle(short.length>=5?short:pool),sf={},sc={};pick=[];
      src.forEach(function(e){var a=norm(frOf(e)),c=norm(crOf(e));if(pick.length<5&&!sf[a]&&!sc[c]){sf[a]=sc[c]=1;pick.push(e);}});
    }
    var ko={};
    var left=pick.map(function(e,i){return {t:frOf(e),p:i};});
    var right=pick.map(function(e,i){return {t:crOf(e),p:i};});
    for(var tries=0;tries<30;tries++){right=shuffle(right);if(right.every(function(r,i){return r.p!==i;})||right.length<2)break;}
    askQ(B(),'Relie chaque mot à sa traduction.');act(G(),'talk');
    var tile=function(o){return '<button class="tile" type="button" aria-pressed="false" data-p="'+o.p+'">'+dt(o.t)+'</button>';};
    var body=app.querySelector('.ex-body');
    body.innerHTML='<div class="pairs"><div class="col"><h4>Français</h4>'+left.map(tile).join('')+'</div><div class="col"><h4>Kréyòl</h4>'+right.map(tile).join('')+'</div></div>';
    var PAL=['m1','m2','m3','m4','m5'],sel=null,mi=0,errs=0,g=G();
    var isDone=function(t){return t.classList.contains('matched')||PAL.some(function(c){return t.classList.contains(c);});};
    function match(a,b){
      var c=PAL[mi++%PAL.length];
      [a,b].forEach(function(x){x.classList.add(c);x.classList.remove('sel');x.setAttribute('aria-pressed','false');retrigger(x,'anim-pop');x.insertAdjacentHTML('beforeend',icon('i-check'));x.setAttribute('aria-disabled','true');x.setAttribute('aria-label',x.textContent+' : relié');});
      setTimeout(function(){a.classList.add('matched');b.classList.add('matched');},350);
      if(mi===pick.length){
        C.answered=true;syncJokers();
        var ok=errs===0;
        setTimeout(function(){
          scored(ok,body.querySelector('.pairs'),pick,true,ko);
          confetti(body.querySelector('.pairs'),24);act(g,'dance');
          showFeedback(ok,ok?okTitle():'Pas tout à fait',ok?'Toutes les paires sont reliées, sans erreur.':'Toutes les paires sont reliées, avec <b>'+errs+' erreur'+(errs>1?'s':'')+'</b>.',ok?250:400);
        },500);
      }
    }
    body.querySelectorAll('.tile').forEach(function(t){t.addEventListener('click',function(){
      if(C.answered||isDone(t))return;
      if(!sel){sel=t;t.classList.add('sel');t.setAttribute('aria-pressed','true');return;}
      if(sel===t){t.classList.remove('sel');t.setAttribute('aria-pressed','false');sel=null;return;}
      var a=sel,b=t;a.classList.remove('sel');a.setAttribute('aria-pressed','false');sel=null;
      if(a.parentNode===b.parentNode){sel=b;b.classList.add('sel');b.setAttribute('aria-pressed','true');return;}
      if(a.dataset.p===b.dataset.p){
        vib(15);act(g,'joy');relax(g,1500);
        match(a,b);
      }else{
        errs++;ko[pick[+a.dataset.p].id]=1;ko[pick[+b.dataset.p].id]=1;
        [a,b].forEach(function(x){retrigger(x,'wrong');});vib([30,40,30]);act(g,'nod');relax(g,1500);
        sayRep(B(),'erreur');
        setTimeout(function(){a.classList.remove('wrong');b.classList.remove('wrong');},450);
      }
    });});
    /* Indice : une paire juste se relie seule */
    C.hint=function(){
      var cols=body.querySelectorAll('.col'),L0=[].slice.call(cols[0].querySelectorAll('.tile')).filter(function(t){return !isDone(t);});
      if(!L0.length)return;
      var a=L0[0],b=[].filter.call(cols[1].querySelectorAll('.tile'),function(t){return t.dataset.p===a.dataset.p;})[0];
      if(sel){sel.classList.remove('sel');sel.setAttribute('aria-pressed','false');sel=null;}
      match(a,b);
    };
    C.skip=function(){
      body.querySelectorAll('.tile').forEach(function(t){t.setAttribute('aria-disabled','true');});
      showFeedback(false,'Exercice passé','Il ne compte pas dans ton score.',250,{skip:true});
    };
  }

  /* ---------- Écran 5 — Vrai ou faux-ami ? ---------- */
  function exVf(x){
    var e=x.e,real=frOf(e),trap=e.piege;
    var choices=shuffle([{t:real,ok:true},{t:trap,ok:false}]),right=choices[0].ok?0:1;

      +'<div class="vf opts">'+choices.map(function(c){return optHTML('',c.t);}).join('')+'</div>';
    var opts=[].slice.call(body.querySelectorAll('.opt'));
    bindOpts(opts,right,function(o,i){body.querySelector('.fa-card .fr').textContent=qq(fmt(choices[i].t));},function(ok,ch){

    },e);

  /* ---------- Écran 6 — Proverbe à compléter ---------- */
  /* Casse de l'initiale alignée sur le mot caché, pour qu'elle ne trahisse pas la réponse */
  function cap(w,like){var up=/^\p{Lu}/u.test(like);return (up?w.charAt(0).toUpperCase():w.charAt(0).toLowerCase())+w.slice(1);}
  function exProv(x){
    var e=x.e,hid=e.mot_cache;
    var others=distinct(shuffle(DATA.filter(function(o){return o.type==='proverbe'&&o.mot_cache&&o!==e;})).map(function(o){return o.mot_cache;})
      .concat(shuffle(DATA.filter(function(o){return o.type==='mot'&&!/\s/.test(o.cr);})).map(function(o){return o.cr;})),function(w){return w;})
      .filter(function(w){return norm(w)!==norm(hid);}).slice(0,3).map(function(w){return cap(w,hid);});
    var choices=shuffle([hid].concat(others)),right=choices.indexOf(hid);
    askQ(B(),'Quel mot manque dans ce proverbe ?');act(G(),'talk');
    var parts=e.cr.split(hid);
    var body=app.querySelector('.ex-body');
    body.innerHTML='<div class="prov"><span class="qm">'+icon('i-quote')+'</span><p>'
      +parts.map(dt).join('<span class="gap" data-gap>?</span>')+'</p><small>Sens : '+dt(e.fr)+'</small></div>'
      +'<div class="opts two" style="margin-top:var(--s-5)">'+choices.map(function(c){return optHTML('',c);}).join('')+'</div>';
    var opts=[].slice.call(body.querySelectorAll('.opt'));
    var fillGap=function(w){body.querySelectorAll('[data-gap]').forEach(function(gp){gp.textContent=w;});};
    bindOpts(opts,right,function(o,i){fillGap(choices[i]);},function(ok,ch){
      fillGap(hid);
      showFeedback(ok,ok?okTitle():'Pas tout à fait','Le proverbe complet : <b>'+dt(e.cr)+'</b>',ok?250:400,{gauge:{e:e,ch:ch}});
    },e);
    C.hint=makeHint(e,hid,false,choices);
    C.skip=function(){fillGap(hid);skipFb(dt(hid));};
  }

  /* ---------- Écran 11 — Écrire la réponse ---------- */
  function cmpKey(s){return norm(s).replace(/[?!.…,;:«»"()]/g,' ').replace(/[\s  ]+/g,' ').trim();}
  function rawKey(s){return String(s).normalize('NFC').replace(/[’‘`]/g,"'").replace(/[?!.…,;:«»"()]/g,' ').replace(/[\s  ]+/g,' ').trim();}
  function lev(a,b){
    var m=a.length,n=b.length,d=[],i,j;
    for(i=0;i<=m;i++){d[i]=[i];}for(j=0;j<=n;j++)d[0][j]=j;
    for(i=1;i<=m;i++)for(j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
    return d[m][n];
  }
  /* Lettres de la forme attendue qui diffèrent de ce qui a été tapé (alignement d'édition) */
  function diffMarks(typed,target){
    var a=Array.from(typed),b=Array.from(target),m=a.length,n=b.length,d=[],i,j;
    var cost=function(x,y){return x===y?0:(norm(x)===norm(y)?0.5:1);};
    for(i=0;i<=m;i++){d[i]=[i];}for(j=0;j<=n;j++)d[0][j]=j;
    for(i=1;i<=m;i++)for(j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+cost(a[i-1],b[j-1]));
    var mark=new Array(n).fill(false);i=m;j=n;
    while(i>0||j>0){
      if(i>0&&j>0&&d[i][j]===d[i-1][j-1]+cost(a[i-1],b[j-1])){if(a[i-1]!==b[j-1])mark[j-1]=true;i--;j--;}
      else if(j>0&&d[i][j]===d[i][j-1]+1){mark[j-1]=true;j--;}
      else i--;
    }
    /* seules les lettres sont surlignées : espaces et ponctuation ne comptent pas */
    return b.map(function(c,k){return mark[k]&&/[\p{L}\p{N}]/u.test(c)?'<span class="diff">'+esc(c)+'</span>':esc(c);}).join('');
  }
  function exWrite(x){
    var e=x.e,fr=frOf(e),target=crOf(e);
    var accepted=[target,e.cr].concat(e.cr_f?[e.cr_f]:[]).concat(e.variantes||[]);
    askQ(B(),'Écris en créole : <span class="kw">'+qq(dt(fr))+'</span>');act(G(),'talk');
    var body=app.querySelector('.ex-body');
    body.innerHTML='<div class="prompt"><span class="lang">Écris en créole</span><span class="word">'+dt(fr)+'</span></div>'
      +'<input class="answer-in" type="text" aria-label="Ta réponse en créole" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done">'
      +'<div class="check-row"><button class="btn" type="button" data-check disabled>Vérifier</button></div>';
    var inp=body.querySelector('.answer-in'),chk=body.querySelector('[data-check]'),vv=window.visualViewport;
    app.classList.add('writing');
    /* Clavier ouvert : guide masqué, consigne au-dessus du champ, hauteur utile = visualViewport */
    function kbd(){
      var open=document.activeElement===inp&&vv&&(window.innerHeight-vv.height>120);
      app.classList.toggle('kbd-open',!!open);
      app.style.height=open?vv.height+'px':'';
    }
    if(vv)vv.addEventListener('resize',kbd);
    inp.addEventListener('focus',function(){setTimeout(kbd,300);});
    inp.addEventListener('blur',function(){setTimeout(kbd,50);});
    inp.addEventListener('input',function(){chk.disabled=!inp.value.trim();});
    inp.addEventListener('keydown',function(ev){if(ev.key==='Enter'){ev.preventDefault();if(!chk.disabled)chk.click();}});
    chk.addEventListener('click',function(){
      if(C.answered||!inp.value.trim())return;
      var typed=inp.value.trim(),tc=cmpKey(typed),tr=rawKey(typed),best=null;
      accepted.forEach(function(a){
        var r=null;
        if(rawKey(a)===tr)r={lvl:0,a:a};
        else if(cmpKey(a)===tc)r={lvl:1,a:a};
        else if(cmpKey(a).replace(/ /g,'').length>5&&lev(cmpKey(a),tc)===1)r={lvl:2,a:a};
        if(r&&(!best||r.lvl<best.lvl))best=r;
      });
      var ok=!!best;
      inp.readOnly=true;inp.blur();chk.closest('.check-row').hidden=true;app.classList.remove('writing');
      if(vv)vv.removeEventListener('resize',kbd);app.classList.remove('kbd-open');app.style.height='';
      inp.classList.add(ok?'is-ok':'is-ko');if(!ok&&!reduced)retrigger(inp,'anim-shake');
      var ch=scored(ok,inp,[e],true);
      var gauge={e:e,ch:ch};
      if(ok&&best.lvl===0)showFeedback(true,okTitle(),'<b>'+dt(best.a)+'</b> veut dire : '+dt(fr),250,{gauge:gauge});
      else if(ok)showFeedback(true,best.lvl===1?'Juste, à un accent près':'Juste, à une lettre près','On écrit : <b>'+diffMarks(typed.normalize('NFC').replace(/[’‘`]/g,"'"),best.a.normalize('NFC'))+'</b>',250,
        {gauge:gauge,extra:'<p class="typed" style="margin:-8px 0 16px">Tu as écrit : '+esc(typed)+'</p>'});
      else showFeedback(false,'Pas tout à fait','On écrit : <b>'+dt(target)+'</b>',400,
        {gauge:gauge,extra:'<p class="typed" style="margin:-8px 0 16px">Tu as écrit : <s>'+esc(typed)+'</s></p>'});
    });
    setTimeout(function(){try{inp.focus({preventScroll:true});}catch(err){}},60);
  }

  /* ---------- Écran 12 — Construire la phrase ---------- */
  /* Étiquettes sans indice : ni ponctuation (, . ; : ! ? …) ni majuscule initiale (sauf mot tout en capitales, sigle).
     La comparaison porte sur ces formes ; le panneau de retour montre la phrase exacte (s.cr). */
  function buildWords(cr){
    return String(cr).trim().split(/\s+/).map(function(w){return w.replace(/[,.;:!?…]/g,'');}).filter(Boolean)
      .map(function(w,i){return (i===0&&!(w.length>1&&w===w.toUpperCase()&&w!==w.toLowerCase()))?w.toLowerCase():w;});
  }
  function exBuild(x){
    var s=x.s||sentencesOf(x.e)[0],words=buildWords(s.cr);
    var order=words.map(function(w,i){return i;});
    for(var t=0;t<20;t++){order=shuffle(order);if(order.some(function(v,i){return v!==i;})||words.length<2)break;}
    askQ(B(),'Remets la phrase en créole dans l\'ordre.');act(G(),'talk');
    var body=app.querySelector('.ex-body');
    body.innerHTML='<p class="fr-sentence">'+qq(dt(s.fr))+'</p><div class="slots" aria-label="Ta phrase"></div>'
      +'<div class="bank" aria-label="Étiquettes">'+order.map(function(i){return '<button class="tag" type="button" data-i="'+i+'">'+dt(words[i])+'</button>';}).join('')+'</div>';
    var slots=body.querySelector('.slots'),bank=body.querySelector('.bank'),chk=app.querySelector('[data-check]');
    var flip=function(el,first){if(reduced||!el.animate)return;var last=el.getBoundingClientRect();el.animate([{transform:'translate('+(first.left-last.left)+'px,'+(first.top-last.top)+'px)'},{transform:'none'}],{duration:220,easing:'cubic-bezier(.2,.8,.2,1)'});};
    var sync=function(){chk.disabled=bank.querySelectorAll('.tag:not(.ghost)').length>0;};
    body.addEventListener('click',function(ev){
      var tg=ev.target.closest('.tag');if(!tg||C.answered||tg.classList.contains('ghost'))return;
      var first=tg.getBoundingClientRect();
      if(tg.parentNode===bank){var gh=tg.cloneNode(true);gh.className='tag ghost';gh.setAttribute('aria-hidden','true');gh.tabIndex=-1;tg.replaceWith(gh);tg._ghost=gh;slots.appendChild(tg);}
      else{var g2=tg._ghost;if(g2&&g2.parentNode)g2.replaceWith(tg);else bank.appendChild(tg);}
      flip(tg,first);sync();
    });
    chk.addEventListener('click',function(){
      if(C.answered||bank.querySelectorAll('.tag:not(.ghost)').length)return;
      var placed=[].slice.call(slots.querySelectorAll('.tag'));
      var okEach=placed.map(function(tg,i){return words[+tg.dataset.i]===words[i];});
      var ok=okEach.every(Boolean)&&placed.length===words.length;
      chk.disabled=true;
      placed.forEach(function(tg,i){tg.setAttribute('aria-disabled','true');
        if(ok){setTimeout(function(){tg.classList.add('is-ok');retrigger(tg,'anim-pop');},reduced?0:i*60);}
        else{tg.classList.add(okEach[i]?'is-ok':'is-ko');if(!okEach[i]&&!reduced)retrigger(tg,'anim-shake');}
      });
      var ch=scored(ok,slots,[s.e]);
      var wait=ok?(reduced?0:placed.length*60+260):400;
      showFeedback(ok,ok?okTitle():'Pas tout à fait',ok?'<b>'+dt(s.cr)+'</b>':'La bonne phrase : <b>'+dt(s.cr)+'</b>',wait,{gauge:{e:s.e,ch:ch}});
    });
  }

  /* ======================================================================
     ÉCRAN 7 — Fin de niveau (et fin de révision)
     ====================================================================== */
  function endScreen(title,stars,pct,gained,buttons){
    var st=streak();
    app.className='screen';
    app.innerHTML='<div class="statusbar"></div><div class="scr-body"><div class="end">'

      +(stars?'<div class="big-stars" role="img" aria-label="'+stars+' étoile'+(stars>1?'s':'')+' sur 3">'
        +[0,1,2].map(function(i){return '<span class="'+(i===1?'mid':'')+'">'+icon('i-star','fill '+(i<stars?'st-on':'st-off'))+'</span>';}).join('')+'</div>':'')
      +'<h2>'+esc(title)+'</h2>'
      +guideHTML('joy')
      +'<div class="bubble"></div>'
      +'<div class="stats">'
        +'<div class="stat" style="background:var(--c-ciel)">'+icon('i-bolt','fill')+'<b class="count-xp">+0</b><small>XP</small></div>'
        +'<div class="stat" style="background:var(--c-canne)">'+icon('i-target')+'<b>'+Math.round(pct*100)+' %</b><small>Justes</small></div>'
        +'<div class="stat" style="background:var(--c-flamboyant)">'+icon('i-flame','fill')+'<b>'+st+'</b><small>Jour'+(st>1?'s':'')+'</small></div></div>'
      +(buttons.note||'')
      +'</div></div>'
      +'<div class="scr-foot" style="display:grid;gap:14px;padding-top:8px">'+buttons.html+'</div>';
    mountGuides();
    var g=app.querySelector('.end .guide'),b=app.querySelector('.end .bubble');
    if(!sayRep(b,'fin'))b.classList.add('hide');
    app.querySelectorAll('.big-stars span').forEach(function(s){retrigger(s,'in');});
    var cx=app.querySelector('.count-xp'),t0=null;
    if(reduced){cx.textContent='+'+gained;}
    else{var step=function(ts){if(!t0)t0=ts;var k=Math.min(1,(ts-t0)/800);cx.textContent='+'+Math.round(gained*k);if(k<1)requestAnimationFrame(step);};requestAnimationFrame(step);}
    setTimeout(function(){confetti(app.querySelector('.big-stars')||app.querySelector('.end h2'),30);},300);
    act(g,'dance');
    app.querySelectorAll('[data-home]').forEach(function(x){x.addEventListener('click',function(){L=null;homeSit='accueil';renderHome();});});
  }
  function finishLevel(){
    var t=L.t,pct=L.total?L.good/L.total:0;
    var stars=pct>=.9?3:(pct>=.7?2:1);
    var firstTime=!Object.keys(S.done).length;
    var wasDone=!!S.done[t.id];
    S.done[t.id]=true;
    S.stars[t.id]=Math.max(S.stars[t.id]||0,stars);
    S.best[t.id]=Math.max(S.best[t.id]||0,Math.round(pct*100));
    markPlayed();
    if(!wasDone&&L.i+1<THEMES.length)justUnlocked=L.i+1;
    save();
    var next=L.i+1<THEMES.length?L.i+1:-1,li=L.i;
    endScreen(t.name+' · Terminé',stars,pct,L.xp,{
      note:firstTime?'<p class="count" style="margin:0">1 étoile = niveau terminé · 2 étoiles = 70 % de réponses justes · 3 étoiles = 90 %</p>':'',
      html:(next>=0?'<button class="btn" type="button" data-next-lvl>Niveau suivant</button>':'<button class="btn" type="button" data-home>Retour au parcours</button>')
        +'<div class="swipe-row"><button class="btn ghost" type="button" data-replay>Rejouer</button>'
        +(next>=0?'<button class="btn ghost" type="button" data-home>Parcours</button>':'')+'</div>'});
    var nx=app.querySelector('[data-next-lvl]');if(nx)nx.addEventListener('click',function(){justUnlocked=-1;startLevel(next);});
    app.querySelector('[data-replay]').addEventListener('click',function(){startLevel(li);});
    /* En fin de niveau, le bandeau passe après les étoiles */
    checkBadges(1300);
  }
  function finishLesson(){
    var l=L.l,pct=L.total?L.good/L.total:0,stars=pct>=.9?3:(pct>=.7?2:1);
    S.lec[l.n]=today();markPlayed();save();
    endScreen('Leçon '+l.n+' · Terminée',stars,pct,L.xp,{
      note:'<p class="count" style="margin:0">'+(nextLesson()?'Leçon '+(l.n+1)+' demain. Les mots d\'aujourd\'hui reviendront en révision.':'Toutes les leçons sont faites.')+'</p>',
      html:'<button class="btn" type="button" data-home>Retour au parcours</button>'});
    checkBadges(1300);
  }
  function finishRevision(){
    var pct=L.total?L.good/L.total:0;
    S.revDone++;markPlayed();save();
    var more=dueWords().length;
    endScreen('Révision · Terminé',0,pct,L.xp,{
      html:'<button class="btn" type="button" data-home>Retour au parcours</button>'
        +(more?'<button class="btn ghost" type="button" data-more>Réviser encore</button>':'')});
    var m=app.querySelector('[data-more]');if(m)m.addEventListener('click',startRevision);
    checkBadges(1300);
  }

  /* ======================================================================
     ÉCRAN 8 — Lexique
     ====================================================================== */
  var LEX=WORDS;
  var lexDir='fr';
  function themeIndex(id){for(var i=0;i<THEMES.length;i++)if(THEMES[i].id===id)return i;return -1;}
  function hl(s,q){
    s=fmt(s);
    var ns=norm(s),nq=norm(q),i=nq?ns.indexOf(nq):-1;
    if(i<0||ns.length!==s.length)return esc(s);
    return esc(s.slice(0,i))+'<mark>'+esc(s.slice(i,i+nq.length))+'</mark>'+esc(s.slice(i+nq.length));
  }
  function renderLex(){
    app.className='screen';
    app.innerHTML='<div class="statusbar"></div>'
      +'<div class="home-top"><h2 style="font-size:var(--fs-2xl)">Lexique</h2><span class="chip">'+icon('i-book')+LEX.length+' mots</span></div>'
      +'<div class="scr-body">'
      +'<label class="search">'+icon('i-search')+'<input type="search" aria-label="Rechercher un mot, en français ou en créole" placeholder="Chercher un mot" autocomplete="off" spellcheck="false"></label>'
      +'<div class="dir" role="group" aria-label="Langue affichée en premier">'
        +'<button type="button" aria-pressed="'+(lexDir==='fr')+'" data-dir="fr">Français'+icon('i-swap')+'Créole</button>'
        +'<button type="button" aria-pressed="'+(lexDir==='kr')+'" data-dir="kr">Créole'+icon('i-swap')+'Français</button></div>'
      +'<p class="count" aria-live="polite"></p><ul class="results"></ul></div>'+tabbar('lex');
    bindTabs();
    var inp=app.querySelector('.search input'),ul=app.querySelector('.results'),cnt=app.querySelector('.count');
    function render(){
      var q=inp.value.trim(),nq=norm(q);
      var r=LEX.map(function(e){
        if(!nq)return {e:e,s:0};
        var fr=[e.fr,e.fr_f].filter(Boolean),cr=[e.cr,e.cr_f].concat(e.variantes||[]).filter(Boolean);
        var main=lexDir==='fr'?fr:cr,other=lexDir==='fr'?cr:fr,best=-1;
        main.forEach(function(s){var i=norm(s).indexOf(nq);if(i>=0)best=Math.max(best,i===0?4:3);});
        other.forEach(function(s){var i=norm(s).indexOf(nq);if(i>=0)best=Math.max(best,i===0?2:1);});
        return {e:e,s:best};
      }).filter(function(o){return o.s>=0;});
      if(nq)r.sort(function(a,b){return b.s-a.s;});
      cnt.textContent=r.length+(r.length>1?' résultats':' résultat');
      ul.innerHTML=r.map(function(o){
        var e=o.e,ti=themeIndex(e.theme),t=THEMES[ti]||LEC_THEME;
        var fr=frOf(e),cr=crOf(e),big=lexDir==='fr'?fr:cr,small=lexDir==='fr'?cr:fr;
        var lead=hasIl(e)?'<span class="plate"><svg aria-hidden="true"><use href="#il-'+esc(e.illustration)+'"/></svg></span>':'<i class="dot" aria-hidden="true" style="background:'+t.hex+'"></i>';
        return '<li class="res">'+lead+'<div><b>'+hl(big,q)+'</b><span>'+hl(small,q)+'</span>'
          +(e.variantes&&e.variantes.length?'<span>Se dit aussi : '+e.variantes.map(function(v){return hl(v,q);}).join(', ')+'</span>':'')
          +(e.note?'<span>'+dt(e.note)+'</span>':'')
          +'</div>'+gaugeHTML(e)+'</li>';
      }).join('')||'<li class="res"><div><b>Aucun mot trouvé</b><span>Essaie une autre orthographe : les accents ne comptent pas.</span></div></li>';
    }
    inp.addEventListener('input',render);
    app.querySelectorAll('.dir button').forEach(function(b){b.addEventListener('click',function(){
      lexDir=b.dataset.dir;app.querySelectorAll('.dir button').forEach(function(x){x.setAttribute('aria-pressed',x===b?'true':'false');});render();
    });});
    render();
  }

  /* ======================================================================
     ÉCRAN 13 — Succès (vitrine des badges)
     ====================================================================== */
  function renderBadges(){
    app.className='screen';
    var got=BADGES.filter(function(b){return S.badges[b.id];}).length;
    app.innerHTML='<div class="statusbar"></div>'
      +'<div class="home-top"><h2 style="font-size:var(--fs-2xl)">Succès</h2><span class="b-count">'+got+' / '+BADGES.length+' obtenus</span></div>'
      +'<div class="scr-body" style="overflow-y:auto"><div class="badges">'
      +BADGES.map(function(b,i){var ok=!!S.badges[b.id];
        return '<button class="badge'+(ok?'':' locked')+'" type="button" data-b="'+i+'" aria-label="'+esc(b.t)+(ok?', obtenu':', verrouillé, '+esc(b.sm(b.val())))+'">'+medalHTML(b,!ok,true)+'<b>'+esc(b.t)+'</b>'+(ok?'':'<small>'+esc(b.sm(b.val()))+'</small>')+'</button>';}).join('')
      +'</div></div>'+tabbar('badges');
    bindTabs();
    app.querySelectorAll('[data-b]').forEach(function(x){x.addEventListener('click',function(){openBadge(BADGES[+x.dataset.b]);});});
  }

  /* ---------- Démarrage ---------- */
  if(S.name&&S.g)renderHome();else renderOnb(false);
  /* Typographie : tout texte affiché (écrans, bulles, panneaux, bandeaux) passe par typo() avant d'être peint */
  typoTree(document.body);
  if(window.MutationObserver)new MutationObserver(function(ms){ms.forEach(function(m){if(m.type==='characterData')typoText(m.target);else m.addedNodes.forEach(typoTree);});}).observe(document.body,{childList:true,subtree:true,characterData:true});
})();
</script>
</body></html>
